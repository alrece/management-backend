    -- 触发器：自动更新 update_time
    CREATE OR REPLACE FUNCTION update_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.update_time = NOW();
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;
    DO $$
    DECLARE t TEXT;
    BEGIN
        FOR t IN
            SELECT table_name FROM information_schema.columns
            WHERE column_name = 'update_time' AND table_schema = 'public'
            AND table_name IN ('sys_tenant','sys_dept','sys_user','sys_role','sys_menu','sys_user_role','sys_role_menu','sys_dict_type','sys_dict_data','sys_user_post','sys_post','sys_param','sys_notice','sys_file','sys_client')
            GROUP BY table_name
        LOOP
            EXECUTE format('CREATE TRIGGER trg_%s_update BEFORE UPDATE ON %I FOR EACH ROW EXECUTE FUNCTION update_timestamp()', t, t);
        END LOOP;
    END;
    $$;

  02-workflow.sql: |
    -- 工作流引擎建表脚本
    CREATE TABLE IF NOT EXISTS wf_workflow (
        id              BIGINT          NOT NULL,
        tenant_id       BIGINT          NOT NULL DEFAULT 0,
        name            VARCHAR(100)    NOT NULL,
        category_id     BIGINT          DEFAULT 0,
        definition      JSONB,
        trigger_type    VARCHAR(20)     DEFAULT 'manual',
        trigger_config  JSONB,
        version         INT             DEFAULT 1,
        status          SMALLINT        NOT NULL DEFAULT 0,
        remark          VARCHAR(500)    DEFAULT '',
        creator         BIGINT          DEFAULT NULL,
        create_time     TIMESTAMPTZ     NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updater         BIGINT          DEFAULT NULL,
        update_time     TIMESTAMPTZ     NOT NULL DEFAULT CURRENT_TIMESTAMP,
        deleted         SMALLINT        NOT NULL DEFAULT 0,
        create_dept     BIGINT          DEFAULT 0,
        PRIMARY KEY (id)
    );
    CREATE INDEX IF NOT EXISTS idx_wf_workflow_tenant ON wf_workflow(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_wf_workflow_category ON wf_workflow(category_id);
    CREATE INDEX IF NOT EXISTS idx_wf_workflow_deleted ON wf_workflow(deleted);
    COMMENT ON TABLE wf_workflow IS '工作流定义表';

    CREATE TABLE IF NOT EXISTS wf_execution (
        id              BIGINT          NOT NULL,
        tenant_id       BIGINT          NOT NULL DEFAULT 0,
        workflow_id     BIGINT          NOT NULL,
        status          VARCHAR(20)     NOT NULL DEFAULT 'running',
        trigger_type    VARCHAR(20),
        start_time      TIMESTAMPTZ     NOT NULL DEFAULT CURRENT_TIMESTAMP,
        end_time        TIMESTAMPTZ,
        input           JSONB,
        output          JSONB,
        error_msg       TEXT,
        creator         BIGINT          DEFAULT NULL,
        PRIMARY KEY (id)
    );
    CREATE INDEX IF NOT EXISTS idx_wf_execution_tenant ON wf_execution(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_wf_execution_workflow ON wf_execution(workflow_id);
    CREATE INDEX IF NOT EXISTS idx_wf_execution_status ON wf_execution(status);
    COMMENT ON TABLE wf_execution IS '工作流执行实例表';

    CREATE TABLE IF NOT EXISTS wf_node_log (
        id              BIGINT          NOT NULL,
        tenant_id       BIGINT          NOT NULL DEFAULT 0,
        execution_id    BIGINT          NOT NULL,
        workflow_id     BIGINT          NOT NULL,
        node_id         VARCHAR(50)     NOT NULL,
        node_type       VARCHAR(30)     NOT NULL,
        status          VARCHAR(20)     NOT NULL DEFAULT 'running',
        input           JSONB,
        output          JSONB,
        error_msg       TEXT,
        start_time      TIMESTAMPTZ     NOT NULL,
        end_time        TIMESTAMPTZ,
        retry_count     INT             DEFAULT 0,
        PRIMARY KEY (id)
    );
    CREATE INDEX IF NOT EXISTS idx_wf_node_log_execution ON wf_node_log(execution_id);
    CREATE INDEX IF NOT EXISTS idx_wf_node_log_workflow ON wf_node_log(workflow_id);
    COMMENT ON TABLE wf_node_log IS '节点执行日志表';

    CREATE TABLE IF NOT EXISTS wf_trigger (
        id              BIGINT          NOT NULL,
        tenant_id       BIGINT          NOT NULL DEFAULT 0,
        workflow_id     BIGINT          NOT NULL,
        trigger_type    VARCHAR(20)     NOT NULL,
        config          JSONB,
        cron_entry_id   INT             DEFAULT 0,
        active          BOOLEAN         DEFAULT FALSE,
        creator         BIGINT          DEFAULT NULL,
        create_time     TIMESTAMPTZ     NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updater         BIGINT          DEFAULT NULL,
        update_time     TIMESTAMPTZ     NOT NULL DEFAULT CURRENT_TIMESTAMP,
        deleted         SMALLINT        NOT NULL DEFAULT 0,
        create_dept     BIGINT          DEFAULT 0,
        PRIMARY KEY (id)
    );
    CREATE INDEX IF NOT EXISTS idx_wf_trigger_workflow ON wf_trigger(workflow_id);
    CREATE INDEX IF NOT EXISTS idx_wf_trigger_tenant ON wf_trigger(tenant_id);
    COMMENT ON TABLE wf_trigger IS '触发器配置表';

    CREATE TABLE IF NOT EXISTS wf_category (
        id              BIGINT          NOT NULL,
        tenant_id       BIGINT          NOT NULL DEFAULT 0,
        name            VARCHAR(100)    NOT NULL,
        parent_id       BIGINT          DEFAULT 0,
        sort            INT             DEFAULT 0,
        status          SMALLINT        NOT NULL DEFAULT 0,
        creator         BIGINT          DEFAULT NULL,
        create_time     TIMESTAMPTZ     NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updater         BIGINT          DEFAULT NULL,
        update_time     TIMESTAMPTZ     NOT NULL DEFAULT CURRENT_TIMESTAMP,
        deleted         SMALLINT        NOT NULL DEFAULT 0,
        create_dept     BIGINT          DEFAULT 0,
        PRIMARY KEY (id)
    );
    CREATE INDEX IF NOT EXISTS idx_wf_category_tenant ON wf_category(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_wf_category_parent ON wf_category(parent_id);
    COMMENT ON TABLE wf_category IS '工作流分类表';
---
apiVersion: v1
kind: Secret
metadata:
  name: pg-secret
  namespace: mb
type: Opaque
stringData:
  POSTGRES_USER: "mb_user"
  POSTGRES_PASSWORD: "mb_pass_2026"
  POSTGRES_DB: "management_backend"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mb
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pg-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: pg-secret
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mb_user", "-d", "management_backend"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "mb_user", "-d", "management_backend"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: init-sql
          configMap:
            name: pg-init-sql
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mb
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
