apiVersion: apps/v1
kind: Deployment
metadata:
  name: mb-frontend
  namespace: mb
  labels:
    app: mb-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mb-frontend
  template:
    metadata:
      labels:
        app: mb-frontend
    spec:
      containers:
        - name: mb-frontend
          image: mb-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: mb-frontend
  namespace: mb
spec:
  selector:
    app: mb-frontend
  ports:
    - port: 80
      targetPort: 80
