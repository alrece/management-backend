apiVersion: v1
kind: ConfigMap
metadata:
  name: system-config
  namespace: mb
data:
  config.yaml: |
    server:
      port: 8081
      mode: release

    postgres:
      host: postgres.mb.svc.cluster.local
      port: 5432
      username: mb_user
      password: "mb_pass_2026"
      database: management_backend
      sslmode: disable
      max-idle-conns: 10
      max-open-conns: 100
      log-level: warn

    redis:
      host: redis.mb.svc.cluster.local
      port: 6379
      password: ""
      db: 0
      sentinel:
        enabled: false

    jwt:
      secret: "k8s-deploy-jwt-secret-2026"
      access-expire: 1800
      refresh-expire: 604800
      issuer: management-backend

    log:
      level: info
      format: json
      output: stdout
      file:
        enable: false

    snowflake:
      node: 1

    tenant:
      enable: true
      ignore-tables:
        - sys_menu
        - sys_tenant
        - sys_role_menu
      max-pool-size: 50
      idle-timeout: 30
      max-conns-per-tenant: 10
      db-name-prefix: "mb_tenant_"

    cors:
      allowed-origins:
        - "*"

    oss:
      type: minio
      minio:
        endpoint: minio.mb.svc.cluster.local:9000
        access-key: minioadmin
        secret-key: minioadmin
        bucket: management
        use-ssl: false

    login-security:
      max-fail-count: 5
      rate-limit-per-ip: 20
      rate-limit-per-acct: 5
      password-min-len: 8
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mb-system
  namespace: mb
  labels:
    app: mb-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mb-system
  template:
    metadata:
      labels:
        app: mb-system
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres.mb.svc.cluster.local -p 5432 -U mb_user; do echo 'waiting for postgres...'; sleep 2; done;"]
        - name: wait-redis
          image: redis:7-alpine
          command: ["sh", "-c", "until redis-cli -h redis.mb.svc.cluster.local ping; do echo 'waiting for redis...'; sleep 2; done;"]
      containers:
        - name: mb-system
          image: mb-system:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
            - containerPort: 9081
          volumeMounts:
            - name: config
              mountPath: /app/configs/config.yaml
              subPath: config.yaml
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: system-config
---
apiVersion: v1
kind: Service
metadata:
  name: mb-system
  namespace: mb
spec:
  selector:
    app: mb-system
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 9081
      targetPort: 9081
