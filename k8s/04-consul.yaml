apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul
  namespace: mb
  labels:
    app: consul
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      containers:
        - name: consul
          image: hashicorp/consul:1.15
          ports:
            - containerPort: 8500
          command: ["consul", "agent", "-dev", "-client=0.0.0.0"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /v1/status/leader
              port: 8500
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/status/leader
              port: 8500
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: mb
spec:
  selector:
    app: consul
  ports:
    - port: 8500
      targetPort: 8500
