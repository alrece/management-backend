server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://mb-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: management-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: management-backend
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            trace_id: trace_id
            tenant_id: tenant_id
            request_id: request_id
      - labels:
          level:
          trace_id:
          tenant_id:
