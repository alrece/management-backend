global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "management-backend"
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          service: "management-backend"
    metrics_path: /metrics
    scrape_interval: 10s
