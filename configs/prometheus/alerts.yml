groups:
  - name: management-backend
    rules:
      - alert: HighConnectionPool
        expr: mysql_connections{state="in_use"} > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL 连接池使用超过 80%"

      - alert: HighRedisMemory
        expr: rate(redis_commands_total[5m]) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis 命令速率异常高"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "5xx 错误率超过 5%"

      - alert: HighP99Latency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P99 延迟超过 1 秒"

      - alert: HighGoroutines
        expr: go_goroutines > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Goroutine 数量超过 1000"

      - alert: TenantInitFailed
        expr: increase(http_requests_total{path="/api/system/tenant",status=~"5.."}[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "租户初始化可能失败"
