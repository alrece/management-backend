root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/system"
  cmd = "go build -o ./tmp/system ./cmd/system"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "ruoyi-vue-pro", "ruoyi-vue-plus-ai-engineering"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "yaml", "yml"]
  stop_on_error = true

[misc]
  clean_on_exit = true
